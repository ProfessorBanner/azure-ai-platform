# Product-local Python configuration for ml-lifecycle-demo.
#
# Mirrors the repository's quality conventions (Ruff for formatting and linting,
# mypy in strict mode, pytest) so a product is checked the same way the platform
# is.
#
# Unlike hello-databricks, this product DOES declare runtime dependencies. The
# Databricks Runtime supplies PySpark, but it does not supply the MLflow 3 and
# scikit-learn versions this lifecycle is built against, so those are installed
# on the job cluster as pinned PyPI libraries (resources/job.yml). The exact
# same pins are declared here and locked in uv.lock, which is what makes the
# versions CI tests against and the versions the cluster runs the single fact
# they should be.

[project]
name = "ml-lifecycle-demo"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "mlflow==3.15.2",
  "scikit-learn==1.9.0",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  # Test-only. tests/unit/test_retraining.py parses resources/job.yml to assert
  # the deployed job graph matches the Python it drives, rather than trusting
  # that the two agree. PyYAML arrives transitively via MLflow anyway; declaring
  # it makes the test's dependency explicit instead of accidental.
  "pyyaml>=6,<7",
  "types-PyYAML>=6,<7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
# PySpark is provided by the Databricks Runtime and is deliberately not a
# product dependency, so its types are unavailable locally.
ignore_missing_imports = true
