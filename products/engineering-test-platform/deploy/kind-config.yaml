# Local kind cluster for practising rollouts.
#
# Two nodes so a Deployment can actually spread across them and a rollout has
# somewhere to schedule new pods before old ones terminate. No host ports are
# mapped: access is via `kubectl port-forward`, which keeps the cluster
# self-contained and avoids colliding with anything already bound on the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
  - role: worker
