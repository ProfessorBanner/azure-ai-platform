# Product-local Python configuration for engineering-test-platform.
#
# Deliberately independent of the repository root project: this product is
# containerised and deployed to Kubernetes, so its dependency set and lock file
# must describe exactly what ships in the image and nothing else.

[project]
name = "engineering-test-platform"
version = "0.1.0"
description = "Engineering surrogate-model inference service used to practise containerisation, Kubernetes health checks, releases, monitoring and rollback."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_test_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
