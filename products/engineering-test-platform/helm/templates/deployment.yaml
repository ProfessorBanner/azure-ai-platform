apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "engineering-test-platform.fullname" . }}
  labels:
    {{- include "engineering-test-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  # Keep a small, bounded rollback window: enough history to roll back a bad
  # release, not enough to accumulate indefinitely.
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      {{- include "engineering-test-platform.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "engineering-test-platform.labels" . | nindent 8 }}
    spec:
      # The application never calls the Kubernetes API, so it is given no token
      # to call it with.
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: MODEL_VERSION
              value: {{ .Values.modelVersion | quote }}

          # Startup gates the other probes: while it is failing, readiness and
          # liveness are not evaluated, so a slow start is never mistaken for a
          # crash loop.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          # Readiness controls traffic: it depends on the model being loaded.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}

          # Liveness controls restarts, so it deliberately hits the endpoint that
          # does NOT depend on the model. A pod that is merely unready must not
          # be killed.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
