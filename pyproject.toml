[project]
name = "azure-ai-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "labs/agent-ecosystem/foundry-agent",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["products/hello-databricks/tests"]
pythonpath = ["products/hello-databricks/src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
