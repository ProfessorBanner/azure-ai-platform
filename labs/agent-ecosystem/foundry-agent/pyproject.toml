[project]
name = "foundry-agent-lab"
version = "0.1.0"
description = "Phase 19 capability lab: Microsoft Foundry managed agent runtime, compared against the Phase 18 application-owned agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "azure-ai-projects==2.5.0",
  "azure-identity>=1.19,<2",
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
